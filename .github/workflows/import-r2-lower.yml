name: Import R2 lower source archive

on:
  push:
    branches: [main]
    paths:
      - imports/RC_ONE_AREA_clean.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract cleaned competition source
        run: |
          mkdir -p R2/lower/RC_ONE_AREA
          unzip -q imports/RC_ONE_AREA_clean.zip -d R2/lower/RC_ONE_AREA
          rm imports/RC_ONE_AREA_clean.zip
          rmdir imports 2>/dev/null || true
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "archive: add 2026 ROBOCON R2 lower competition code"
          git push
